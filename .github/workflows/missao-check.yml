name: MISSÃO — smoke e integridade
on:
  pull_request:
  push:
    branches: [main, feat/missao-premium-permav-20261029]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check app.js
      - run: node tests/smoke.cjs
